<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
<title id="title">测评命令快捷复制：资产入口与弹窗设计预览</title>
<desc id="desc">资产工具条提供测评命令按钮。弹窗选中服务器、Linux RHEL/CentOS，左侧身份鉴别分组，右侧显示账号、密码复杂度和有效期查询，每段与整组均提供复制操作。</desc>
<defs><style>
text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#0f172a;font-size:15px}
.muted{fill:#475569;font-size:14px}.small{fill:#64748b;font-size:13px}.title{font-size:20px;font-weight:600}.bold{font-weight:600}.code{font-family:Consolas,'Microsoft YaHei',monospace;font-size:15px}.blue{fill:#1d4ed8}.white{fill:white}
</style></defs>
<rect width="1200" height="930" fill="#f1f5f9"/>
<text x="56" y="42" class="title">测评命令快捷复制 · 设计预览</text>
<text x="56" y="70" class="muted">入口放在资产页工具条；按平台查看，按核查用途复制。</text>
