<rect x="812" y="110" width="136" height="44" fill="white" stroke="#cbd5e1"/>
<text x="848" y="138">调整顺序</text>
<rect x="956" y="110" width="172" height="44" fill="white" stroke="#2563eb"/>
<path d="M973 123l6 7-6 7m13 0h8" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="1006" y="138" class="blue bold">测评命令</text>
<rect x="56" y="204" width="1088" height="666" fill="white" stroke="#cbd5e1"/>
<text x="80" y="240" class="title">测评命令</text>
<text x="80" y="266" class="muted">当前资产：Linux 服务器</text>
<rect x="1080" y="216" width="44" height="44" fill="white"/>
<path d="M1096 232l12 12m0-12l-12 12" stroke="#64748b" stroke-width="1.8"/>
<line x1="56" y1="286" x2="1144" y2="286" stroke="#e2e8f0"/>
<text x="80" y="314" class="muted">设备类型</text>
