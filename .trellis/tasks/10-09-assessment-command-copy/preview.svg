<rect x="282" y="326" width="344" height="44" fill="white" stroke="#cbd5e1"/>
<text x="298" y="354">Linux · RHEL / CentOS</text>
<path d="M600 344l6 6 6-6" fill="none" stroke="#64748b" stroke-width="1.5"/>
<text x="642" y="314" class="muted">查找命令</text>
<rect x="642" y="326" width="478" height="44" fill="white" stroke="#cbd5e1"/>
<circle cx="662" cy="346" r="6" fill="none" stroke="#64748b" stroke-width="1.5"/>
<path d="M667 351l5 5" stroke="#64748b" stroke-width="1.5"/>
<text x="684" y="354" class="small">搜索检查项或命令</text>
<line x1="56" y1="390" x2="1144" y2="390" stroke="#e2e8f0"/>
<rect x="57" y="391" width="225" height="478" fill="#f8fafc"/>
<line x1="282" y1="390" x2="282" y2="869" stroke="#e2e8f0"/>
<text x="80" y="424" class="small">检查用途</text>
<rect x="68" y="440" width="202" height="44" fill="#eff6ff"/>
<rect x="68" y="440" width="3" height="44" fill="#2563eb"/>
<text x="88" y="468" class="blue bold">身份鉴别</text>
<text x="88" y="516">登录失败与超时</text>
<text x="88" y="564">访问控制</text>
<text x="88" y="612">远程管理</text>
<text x="88" y="660">日志审计</text>
<text x="88" y="708">版本与网络</text>
<text x="306" y="424" class="title">身份鉴别</text>
<text x="306" y="450" class="muted">在 Linux Shell 执行；部分配置需要管理员权限。</text>
<rect x="988" y="404" width="132" height="44" fill="#2563eb"/>
<text x="1022" y="432" class="white bold">复制本组</text>
<line x1="306" y1="466" x2="1120" y2="466" stroke="#e2e8f0"/>
<text x="306" y="502" class="bold">用户列表</text>
<rect x="1036" y="476" width="84" height="44" fill="white" stroke="#cbd5e1"/>
<text x="1063" y="504">复制</text>
<rect x="306" y="528" width="814" height="48" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="322" y="558" class="code">getent passwd</text>
<text x="306" y="614" class="bold">密码复杂度策略</text>
<rect x="1036" y="588" width="84" height="44" fill="white" stroke="#cbd5e1"/>
<text x="1063" y="616">复制</text>
<rect x="306" y="640" width="814" height="66" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="322" y="667" class="code">cat /etc/pam.d/system-auth</text>
<text x="322" y="690" class="code">cat /etc/pam.d/password-auth</text>
<text x="306" y="744" class="bold">密码有效期与默认策略</text>
<rect x="1036" y="718" width="84" height="44" fill="white" stroke="#cbd5e1"/>
<text x="1063" y="746">复制</text>
<rect x="306" y="770" width="814" height="48" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="322" y="800" class="code">cat /etc/login.defs</text>
<text x="306" y="843" class="small">默认策略与既有账号的实际有效期需分别核查。</text>
<text x="80" y="909" class="small">复制成功显示“已复制”；受限时提供手动选择文本。说明文字不进入复制内容。</text>
</svg>
